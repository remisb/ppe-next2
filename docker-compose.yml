# Pinned so containers, networks and the volume are ppe-next2's whatever the
# checkout directory is called; nothing is shared with the PPE-next project.
name: ppe-next2

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ppe2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppe2}
      POSTGRES_DB: ${POSTGRES_DB:-ppe2}
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    # Postgres 18 images keep data in a versioned subdirectory
    # (/var/lib/postgresql/18/docker), so the volume mounts the parent.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The backup agent, only with the backup profile:
  #   make backup-once          (or docker compose --profile backup run --rm backup list)
  # Builds like production (deploy/backup.Dockerfile), so it needs the token
  # file .github-token for the private dbbackup module (docs/backups.md).
  backup:
    profiles: [backup]
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
      secrets: [github_token]
      args:
        POSTGRES_IMAGE: postgres:18-alpine
    image: ppe-next2-backup:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-ppe2}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ppe2}
      PGDATABASE: ${POSTGRES_DB:-ppe2}
      PGSSLMODE: disable
      DBBACKUP_NAME: ppe-next2-dev
      DBBACKUP_TZ: ${API_ORG_TIMEZONE:-Europe/Vilnius}
      DBBACKUP_TARGET: file:///backups
    volumes:
      - backups:/backups

secrets:
  github_token:
    file: ${GITHUB_TOKEN_FILE:-.github-token}

volumes:
  pgdata:
    name: ppe-next2-pgdata
  backups:
    name: ppe-next2-backups
