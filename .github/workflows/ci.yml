name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CI database is disposable: e2e truncates it, and Go tests clone a
  # database per package on its server (internal/db/dbtest).
  API_TEST_DB_DSN: postgres://ppe2:ppe2@localhost:5432/ppe2_test?sslmode=disable
  # The Makefile runs psql inside docker compose locally; CI talks to the service directly.
  PSQL_CI: psql -d postgres://ppe2:ppe2@localhost:5432/ppe2_test?sslmode=disable -v ON_ERROR_STOP=1 -q
  PGOPTIONS: -c client_min_messages=warning
  # github.com/remisb/dbbackup and github.com/remisb/pdf-mini are private: fetched
  # straight from GitHub (not the proxy) with the DBBACKUP_READ_TOKEN secret, a
  # fine-grained token that can only read those two repositories' contents.
  GOPRIVATE: github.com/remisb/dbbackup,github.com/remisb/pdf-mini

jobs:
  go:
    name: Go (vet, migrations, tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ppe2
          POSTGRES_PASSWORD: ppe2
          POSTGRES_DB: ppe2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ppe2 -d ppe2_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      # The Go version is go.mod's (1.27.3), as the Dockerfiles' golang images are.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Read access to the private dbbackup and pdf-mini modules
        run: |
          git config --global url."https://x-access-token:${DBBACKUP_READ_TOKEN}@github.com/remisb/dbbackup".insteadOf "https://github.com/remisb/dbbackup"
          git config --global url."https://x-access-token:${DBBACKUP_READ_TOKEN}@github.com/remisb/pdf-mini".insteadOf "https://github.com/remisb/pdf-mini"
        env:
          DBBACKUP_READ_TOKEN: ${{ secrets.DBBACKUP_READ_TOKEN }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The same version as the Makefile's GOLANGCI_LINT; keep them equal.
      - name: golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run --build-tags tools ./internal/vault/...
      - name: Migrations apply, revert and re-apply
        run: |
          make migrate PSQL="$PSQL_CI"
          make migrate-down PSQL="$PSQL_CI"
          make migrate PSQL="$PSQL_CI"
      - name: Tests (unit and Postgres)
        run: go test -count=1 ./...

  # The worker's tools tested for real, as the docworker image has them: a job of
  # its own, beside the others, because their packages come from the runners'
  # Ubuntu mirror, which sometimes serves at a few hundred kB/s (LibreOffice's
  # 94 MB once took 8 minutes). The downloaded packages are cached between runs.
  docs-tools:
    name: Document tools (Poppler, Tesseract, LibreOffice)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Read access to the private dbbackup and pdf-mini modules
        run: |
          git config --global url."https://x-access-token:${DBBACKUP_READ_TOKEN}@github.com/remisb/dbbackup".insteadOf "https://github.com/remisb/dbbackup"
          git config --global url."https://x-access-token:${DBBACKUP_READ_TOKEN}@github.com/remisb/pdf-mini".insteadOf "https://github.com/remisb/pdf-mini"
        env:
          DBBACKUP_READ_TOKEN: ${{ secrets.DBBACKUP_READ_TOKEN }}
      # apt keeps what it downloads in a folder the cache can read (its own is
      # root's). The key changes each month, so updated packages get cached.
      - name: Keep apt's downloads for the cache
        id: apt
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          printf '%s\n' "Dir::Cache::Archives \"$HOME/.cache/apt-archives\";" 'APT::Keep-Downloaded-Packages "true";' 'APT::Sandbox::User "root";' \
            | sudo tee /etc/apt/apt.conf.d/99ci-archives >/dev/null
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: apt-cache
        with:
          path: ~/.cache/apt-archives/*.deb
          key: apt-docs-tools-${{ steps.apt.outputs.month }}
          restore-keys: apt-docs-tools-
      - name: Install Poppler, Tesseract and LibreOffice Writer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-lit tesseract-ocr-rus \
            libreoffice-writer-nogui fonts-liberation2 fonts-dejavu-core
          sudo apt-get autoclean -q
      - uses: actions/cache/save@v6
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/apt-archives/*.deb
          key: apt-docs-tools-${{ steps.apt.outputs.month }}
      - name: Text reading with Poppler and Tesseract
        run: go test -tags tools -count=1 ./internal/vault/extract
      - name: DOCX conversion with LibreOffice
        run: go test -tags tools -count=1 ./internal/vault/docx

  web:
    name: Web (typecheck, unit tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # make new-app's template still starts an app that typechecks, passes its tests and builds.
      - run: pnpm check:new-app
      # vite build only: an app's `build` script runs tsc first, which
      # `pnpm typecheck` above already did (as web/Dockerfile does).
      - name: Build
        run: pnpm --filter "{./apps/*}" --filter "{./spikes/ui-sdk-csp}" exec vite build

  e2e:
    name: End-to-end (Playwright via Caddy)
    runs-on: ubuntu-24.04
    # No `needs`: it starts beside the Go and Web jobs instead of after them
    # (about 2.5 minutes sooner). A failure there still fails the run.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ppe2
          POSTGRES_PASSWORD: ppe2
          POSTGRES_DB: ppe2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ppe2 -d ppe2_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      # The Go version is go.mod's (1.27.3), as the Dockerfiles' golang images are.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Read access to the private dbbackup and pdf-mini modules
        run: |
          git config --global url."https://x-access-token:${DBBACKUP_READ_TOKEN}@github.com/remisb/dbbackup".insteadOf "https://github.com/remisb/dbbackup"
          git config --global url."https://x-access-token:${DBBACKUP_READ_TOKEN}@github.com/remisb/pdf-mini".insteadOf "https://github.com/remisb/pdf-mini"
        env:
          DBBACKUP_READ_TOKEN: ${{ secrets.DBBACKUP_READ_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Caddy
        env:
          CADDY_VERSION: 2.11.4
          CADDY_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
        run: |
          tarball="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/${tarball}"
          echo "${CADDY_SHA512}  ${tarball}" | sha512sum -c -
          sudo tar -xzf "${tarball}" -C /usr/local/bin caddy
          caddy version
      - name: Caddyfile is formatted and valid
        run: |
          caddy fmt --diff deploy/Caddyfile
          caddy fmt --diff deploy/caddy/launcher.caddy
          caddy validate --adapter caddyfile --config deploy/Caddyfile
        env:
          SITE_ADDRESS: http://localhost:5181
      - run: make migrate PSQL="$PSQL_CI"
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # vite build only: the Web job typechecks.
      - name: Build the web bundle Caddy serves
        run: pnpm --filter "{./apps/*}" exec vite build
        working-directory: web
      # Chromium is cached per Playwright version, and the system packages it
      # needs are cached as the Document tools job's are (the same mirror).
      - name: Keep apt's downloads for the cache
        id: apt
        working-directory: web/e2e
        run: |
          mkdir -p ~/.cache/apt-archives/partial
          printf '%s\n' "Dir::Cache::Archives \"$HOME/.cache/apt-archives\";" 'APT::Keep-Downloaded-Packages "true";' 'APT::Sandbox::User "root";' \
            | sudo tee /etc/apt/apt.conf.d/99ci-archives >/dev/null
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "playwright=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: apt-cache
        with:
          path: ~/.cache/apt-archives/*.deb
          key: apt-playwright-${{ steps.apt.outputs.playwright }}-${{ steps.apt.outputs.month }}
          restore-keys: apt-playwright-
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.apt.outputs.playwright }}
      - run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get autoclean -q
        working-directory: web/e2e
      - uses: actions/cache/save@v6
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/apt-archives/*.deb
          key: apt-playwright-${{ steps.apt.outputs.playwright }}-${{ steps.apt.outputs.month }}
      - name: End-to-end through Caddy
        run: pnpm e2e
        working-directory: web/e2e
        env:
          E2E_DB_DSN: ${{ env.API_TEST_DB_DSN }}
          E2E_WEB_SERVER: caddy
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          retention-days: 7
