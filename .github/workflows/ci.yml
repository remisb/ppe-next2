name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CI database is disposable; tests and e2e truncate it.
  API_TEST_DB_DSN: postgres://ppe:ppe@localhost:5432/ppe_test?sslmode=disable
  # The Makefile runs psql inside docker compose locally; CI talks to the service directly.
  PSQL_CI: psql -d postgres://ppe:ppe@localhost:5432/ppe_test?sslmode=disable -v ON_ERROR_STOP=1 -q
  PGOPTIONS: -c client_min_messages=warning

jobs:
  go:
    name: Go (vet, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ppe
          POSTGRES_PASSWORD: ppe
          POSTGRES_DB: ppe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ppe -d ppe_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Migrations apply, revert and re-apply
        run: |
          make migrate PSQL="$PSQL_CI"
          make migrate-down PSQL="$PSQL_CI"
          make migrate PSQL="$PSQL_CI"
      - name: Tests (unit and Postgres)
        run: go test -p 1 -count=1 ./...

  web:
    name: Web (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [go, web]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ppe
          POSTGRES_PASSWORD: ppe
          POSTGRES_DB: ppe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ppe -d ppe_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make migrate PSQL="$PSQL_CI"
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web/e2e
      - run: pnpm e2e
        working-directory: web/e2e
        env:
          E2E_DB_DSN: ${{ env.API_TEST_DB_DSN }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          retention-days: 7
