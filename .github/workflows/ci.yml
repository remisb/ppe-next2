name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CI database is disposable; tests and e2e truncate it.
  API_TEST_DB_DSN: postgres://ppe2:ppe2@localhost:5432/ppe2_test?sslmode=disable
  # The Makefile runs psql inside docker compose locally; CI talks to the service directly.
  PSQL_CI: psql -d postgres://ppe2:ppe2@localhost:5432/ppe2_test?sslmode=disable -v ON_ERROR_STOP=1 -q
  PGOPTIONS: -c client_min_messages=warning

jobs:
  go:
    name: Go (vet, migrations, tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ppe2
          POSTGRES_PASSWORD: ppe2
          POSTGRES_DB: ppe2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ppe2 -d ppe2_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Migrations apply, revert and re-apply
        run: |
          make migrate PSQL="$PSQL_CI"
          make migrate-down PSQL="$PSQL_CI"
          make migrate PSQL="$PSQL_CI"
      - name: Tests (unit and Postgres)
        run: go test -p 1 -count=1 ./...

  web:
    name: Web (typecheck, unit tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright via Caddy)
    runs-on: ubuntu-24.04
    needs: [go, web]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ppe2
          POSTGRES_PASSWORD: ppe2
          POSTGRES_DB: ppe2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ppe2 -d ppe2_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Caddy
        env:
          CADDY_VERSION: 2.11.4
          CADDY_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
        run: |
          tarball="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/${tarball}"
          echo "${CADDY_SHA512}  ${tarball}" | sha512sum -c -
          sudo tar -xzf "${tarball}" -C /usr/local/bin caddy
          caddy version
      - name: Caddyfile is formatted and valid
        run: |
          caddy fmt --diff deploy/Caddyfile
          caddy validate --adapter caddyfile --config deploy/Caddyfile
        env:
          SITE_ADDRESS: http://localhost:5181
      - run: make migrate PSQL="$PSQL_CI"
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Build the web bundle Caddy serves
        run: pnpm build
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web/e2e
      - name: End-to-end through Caddy
        run: pnpm e2e
        working-directory: web/e2e
        env:
          E2E_DB_DSN: ${{ env.API_TEST_DB_DSN }}
          E2E_WEB_SERVER: caddy
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          retention-days: 7
