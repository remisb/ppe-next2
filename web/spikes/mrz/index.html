<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MRZ reading spike</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 16px; max-width: 1100px }
      pre, code, .mono { font-family: ui-monospace, Menlo, monospace }
      table { border-collapse: collapse; font-size: 13px } td, th { border: 1px solid #ccc; padding: 2px 6px; text-align: left }
      .ok { color: #0a6d2b } .bad { color: #b00020 } img, canvas { max-width: 100%; border: 1px solid #ddd }
      button, select, input { font-size: 15px; min-height: 36px }
    </style>
  </head>
  <body>
    <h1>MRZ reading spike</h1>
    <p>docs-import plan, phase 1. Nothing leaves this browser; nothing is stored. Readers are fetched without a cache.</p>
    <p>
      <label>Model <select id="model"></select></label>
      <label><input type="checkbox" id="second" /> read twice</label>
    </p>
    <p><label>Photo <input type="file" id="file" accept="image/*" capture="environment" /></label></p>
    <p><button id="run">Run the specimen photos</button> <span id="status"></span></p>
    <div id="out"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
