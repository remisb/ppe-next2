<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Gavort's emblem, served by the staff app at the root. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <!--
      The theme chosen on this device (@ppe/app-shell theme.ts), set before the first paint so nothing
      flashes. Byte for byte the staff app's script, so the CSP's one hash allows both (csp.test.ts).
    -->
    <script>
      try {
        var theme = localStorage.getItem('workwear.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <meta name="referrer" content="no-referrer" />
    <title>Administration · Workwear &amp; Equipment</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
