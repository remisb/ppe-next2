<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <!-- The theme chosen on this device (lib/theme.ts), set before the first paint so nothing flashes. -->
    <script>
      try {
        var theme = localStorage.getItem('workwear.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <!-- Confirmation links carry a token in the path; never send it as a Referer. -->
    <meta name="referrer" content="no-referrer" />
    <title>Workwear &amp; Equipment</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
