<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Launcher Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a control bar over a grey stage holding one scaled device (phone, tablet, desktop); the flows panel beside it, below on narrow screens.
   The page chrome uses --c-*; the mocked launcher inside the device uses --a-* (the staff app's neutrals and navy brand). Tiles carry their own app colour, white text, in both themes. */
:root{
  --c-bg:#f3f3f7; --c-panel:#ffffff; --c-fg:#15162a; --c-mut:#5b5e74; --c-line:#dfe0e9; --c-stage:#e5e6ee;
  --c-acc:#3341a8; --c-acc-soft:#e8eafb; --c-ok:#23703f; --c-hint:#e8590c;
  --a-bg:#f6f6f9; --a-surface:#ffffff; --a-surface-2:#eff0f5; --a-fg:#15162a; --a-mut:#5b5e74; --a-line:#e1e2ea;
  --a-brand:#1c2060; --a-brand-fg:#ffffff; --a-acc:#3341a8; --a-acc-soft:#e8eafb;
  --a-ok:#23703f; --a-ok-bg:#e4f3ea; --a-warn:#9a5a08; --a-warn-bg:#fcf0de; --a-poc:#7a3fa0; --a-poc-bg:#f3e8fa; --a-dev:#5b6475; --a-dev-bg:#eceef3;
  --a-chrome:#e9eaf0; --a-chrome-fg:#4a4d63; --a-scrim:rgb(15 16 30 / .38);
  --shadow:0 1px 2px rgb(20 22 50 / .06), 0 10px 30px rgb(20 22 50 / .10);
  --font:'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --c-bg:#0d0e15; --c-panel:#161824; --c-fg:#eceef7; --c-mut:#9b9eb5; --c-line:#2a2d3f; --c-stage:#08090e;
  --c-acc:#909cff; --c-acc-soft:#252a52; --c-ok:#6fd49a; --c-hint:#ff9a52;
  --a-bg:#0e0f16; --a-surface:#161824; --a-surface-2:#1e2130; --a-fg:#eceef7; --a-mut:#9b9eb5; --a-line:#2a2d3f;
  --a-brand:#c9cdf6; --a-brand-fg:#13153d; --a-acc:#909cff; --a-acc-soft:#252a52;
  --a-ok:#6fd49a; --a-ok-bg:#15301f; --a-warn:#f2b45e; --a-warn-bg:#382811; --a-poc:#d4a6f0; --a-poc-bg:#2e1f3a; --a-dev:#aab1c2; --a-dev-bg:#24273a;
  --a-chrome:#1b1d2a; --a-chrome-fg:#b4b7cc; --a-scrim:rgb(0 0 0 / .55);
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .4); color-scheme:dark }}
:root[data-theme="dark"]{
  --c-bg:#0d0e15; --c-panel:#161824; --c-fg:#eceef7; --c-mut:#9b9eb5; --c-line:#2a2d3f; --c-stage:#08090e;
  --c-acc:#909cff; --c-acc-soft:#252a52; --c-ok:#6fd49a; --c-hint:#ff9a52;
  --a-bg:#0e0f16; --a-surface:#161824; --a-surface-2:#1e2130; --a-fg:#eceef7; --a-mut:#9b9eb5; --a-line:#2a2d3f;
  --a-brand:#c9cdf6; --a-brand-fg:#13153d; --a-acc:#909cff; --a-acc-soft:#252a52;
  --a-ok:#6fd49a; --a-ok-bg:#15301f; --a-warn:#f2b45e; --a-warn-bg:#382811; --a-poc:#d4a6f0; --a-poc-bg:#2e1f3a; --a-dev:#aab1c2; --a-dev-bg:#24273a;
  --a-chrome:#1b1d2a; --a-chrome-fg:#b4b7cc; --a-scrim:rgb(0 0 0 / .55);
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 30px rgb(0 0 0 / .4); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--c-bg); color:var(--c-fg); font-family:var(--font); font-size:14.5px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0 32px}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--c-acc); outline-offset:2px; border-radius:6px}
code,.mono{font-family:var(--mono); font-size:.92em}

/* control bar */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background:color-mix(in oklab, var(--c-bg) 90%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--c-line)}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:31; background:var(--c-bg)}
.bar-row{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; max-width:1500px; margin:0 auto}
.brand{display:flex; gap:10px; align-items:center; margin-right:auto; min-width:0}
.brand .mark{width:30px; height:30px; border-radius:8px; background:var(--a-brand); color:var(--a-brand-fg); display:grid; place-items:center; flex:none}
.brand b{display:block; font-size:14.5px}
.brand span{display:block; font-size:12px; color:var(--c-mut)}
.ctl{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--c-mut)}
.seg{display:inline-flex; border:1px solid var(--c-line); border-radius:9px; padding:2px; background:var(--c-panel)}
.seg button{border:0; background:none; padding:5px 10px; border-radius:7px; font-size:12.5px; font-weight:550; color:var(--c-mut); cursor:pointer; min-height:30px}
.seg button[aria-pressed="true"]{background:var(--c-acc-soft); color:var(--c-fg)}
select.sel{border:1px solid var(--c-line); background:var(--c-panel); border-radius:9px; padding:5px 8px; font-size:13px; min-height:34px}

/* stage + flows */
.layout{display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:18px; max-width:1500px; margin:16px auto 0; align-items:start}
@media (max-width: 980px){ .layout{grid-template-columns:minmax(0,1fr)} }
.stage{background:var(--c-stage); border-radius:14px; padding:18px; min-width:0; overflow:hidden; display:flex; justify-content:center}
.dev-wrap{position:relative; flex:none}
.device{position:absolute; top:0; left:0; transform-origin:0 0; border-radius:22px; overflow:hidden; box-shadow:var(--shadow); background:var(--a-bg); border:10px solid #14151f}
.device.phone{border-radius:44px; border-width:12px}
.device.desktop{border-radius:12px; border-width:1px; border-color:var(--c-line)}
.flows{background:var(--c-panel); border:1px solid var(--c-line); border-radius:14px; padding:16px; display:grid; gap:14px; min-width:0; position:sticky; top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width: 980px){ .flows{position:static} }
.flows h2{font-size:15px; margin:0}
.flows p{margin:0}
.flow-list{display:grid; gap:6px}
.flow-btn{display:grid; grid-template-columns:26px 1fr; gap:8px; align-items:start; text-align:left; border:1px solid var(--c-line); background:var(--c-bg); border-radius:10px; padding:9px 10px; cursor:pointer}
.flow-btn:hover{border-color:var(--c-acc)}
.flow-btn[aria-current="true"]{border-color:var(--c-acc); background:var(--c-acc-soft)}
.flow-btn .n{width:24px; height:24px; border-radius:50%; background:var(--c-panel); border:1px solid var(--c-line); display:grid; place-items:center; font-size:12px; font-weight:600; font-variant-numeric:tabular-nums}
.flow-btn b{display:block; font-size:13.5px}
.flow-btn span{display:block; font-size:12.5px; color:var(--c-mut)}
.steps{display:grid; gap:6px; margin:0; padding:0; list-style:none; counter-reset:s}
.steps li{display:grid; grid-template-columns:22px 1fr; gap:8px; font-size:13.5px; color:var(--c-mut)}
.steps li::before{counter-increment:s; content:counter(s); width:20px; height:20px; border-radius:50%; border:1px solid var(--c-line); display:grid; place-items:center; font-size:11px; font-weight:600}
.steps li.now{color:var(--c-fg); font-weight:550}
.steps li.now::before{border-color:var(--c-hint); color:var(--c-hint)}
.steps li.done{color:var(--c-ok)}
.steps li.done::before{content:"✓"; border-color:var(--c-ok); background:color-mix(in oklab, var(--c-ok) 14%, transparent)}
.why{font-size:12.5px; color:var(--c-mut); border-left:3px solid var(--c-acc); padding:6px 10px; background:var(--c-acc-soft); border-radius:0 8px 8px 0}
.link-btn{border:0; background:none; color:var(--c-acc); padding:0; cursor:pointer; font-size:13px; font-weight:550}
.note{font-size:12px; color:var(--c-mut)}
.hint{outline:3px solid var(--c-hint) !important; outline-offset:2px; animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{outline-color:color-mix(in oklab, var(--c-hint) 35%, transparent)}}
@media (prefers-reduced-motion: reduce){ .hint{animation:none} .sheet,.scrim{animation:none !important} }

/* ===== the mocked launcher (device pixels) ===== */
.screen{position:relative; width:100%; height:100%; display:flex; flex-direction:column; background:var(--a-bg); color:var(--a-fg); font-size:15px; overflow:hidden}
.urlbar{flex:none; display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--a-chrome); color:var(--a-chrome-fg); font-size:13px; border-bottom:1px solid var(--a-line)}
.phone .urlbar{padding-top:38px}
.urlbar .addr{flex:1; min-width:0; background:var(--a-surface); border-radius:8px; padding:5px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:var(--mono); font-size:12.5px}
.urlbar .addr b{color:var(--a-fg); font-weight:500}
.urlbar .tabs-ct{font-size:11.5px; border:1.5px solid currentColor; border-radius:5px; padding:0 5px; font-weight:600}
.body{flex:1; min-height:0; display:flex}
.scroll{flex:1; min-width:0; overflow:auto}
.top{display:flex; align-items:center; gap:10px; padding:14px 18px 6px}
.top .mk{width:34px; height:34px; border-radius:9px; background:var(--a-brand); color:var(--a-brand-fg); display:grid; place-items:center; flex:none}
.top h1{font-size:19px; margin:0; letter-spacing:-.01em}
.top .sp{flex:1}
.avatar{width:36px; height:36px; border-radius:50%; background:var(--a-acc-soft); color:var(--a-acc); display:grid; place-items:center; font-size:13px; font-weight:650; flex:none}
.greet{padding:0 18px; color:var(--a-mut); font-size:14px}
.search{margin:12px 18px 4px; display:flex; align-items:center; gap:8px; background:var(--a-surface); border:1px solid var(--a-line); border-radius:12px; padding:0 12px; min-height:46px}
.search input{border:0; background:none; outline:none; flex:1; min-width:0; font-size:15px; padding:10px 0}
.search kbd{font-family:var(--mono); font-size:11px; border:1px solid var(--a-line); border-radius:5px; padding:1px 5px; color:var(--a-mut)}
.labs-row{margin:8px 18px 0; display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--a-mut)}
.switch{position:relative; width:44px; height:26px; border-radius:13px; border:0; background:var(--a-line); cursor:pointer; flex:none}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s}
.switch[aria-checked="true"]{background:var(--a-acc)}
.switch[aria-checked="true"]::after{left:21px}
.sec{padding:14px 18px 4px}
.sec h2{font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--a-mut); margin:0 0 10px; font-weight:600; display:flex; align-items:center; gap:8px}
.sec h2 .ct{font-weight:500; letter-spacing:0}
.grid{display:grid; gap:12px; grid-template-columns:repeat(3, minmax(0,1fr))}
.tablet .grid{grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px}
.desktop .grid{grid-template-columns:repeat(6, minmax(0,1fr)); gap:14px}
.pins{display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
.pins .tile{width:104px; flex:none}
.tile{position:relative; display:flex; flex-direction:column; justify-content:space-between; gap:8px; aspect-ratio:1/1; border-radius:18px; padding:12px; color:#fff; border:0; text-align:left; cursor:pointer;
  background:var(--tc); box-shadow:0 1px 0 rgb(255 255 255 / .18) inset, 0 6px 14px -8px var(--tc); user-select:none; -webkit-touch-callout:none; min-width:0}
.tablet .tile{border-radius:20px; padding:16px}
.tile:active{transform:scale(.97)}
.tile .ic{width:30px; height:30px}
.tablet .tile .ic{width:38px; height:38px}
.tile .nm{font-size:13.5px; font-weight:600; line-height:1.2; overflow-wrap:anywhere; text-wrap:balance}
.tablet .tile .nm{font-size:16px}
.tile .meta{display:flex; flex-wrap:wrap; gap:4px}
.badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:650; letter-spacing:.03em; text-transform:uppercase; padding:2px 6px; border-radius:6px; background:rgb(255 255 255 / .22); color:#fff; white-space:nowrap}
.tile .more{position:absolute; top:4px; right:4px; width:36px; height:36px; border:0; border-radius:10px; background:transparent; color:#fff; display:grid; place-items:center; cursor:pointer; opacity:.9}
.tile .more:hover{background:rgb(255 255 255 / .16)}
.tile .ext{position:absolute; top:13px; right:42px; opacity:.85}
.tile.ghost{background:var(--a-surface); color:var(--a-mut); border:1.5px dashed var(--a-line); box-shadow:none}
.recent{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--a-line); background:var(--a-surface); border-radius:999px; padding:6px 12px 6px 6px; font-size:13.5px; cursor:pointer; min-height:40px}
.chip .dot{width:26px; height:26px; border-radius:8px; background:var(--tc); color:#fff; display:grid; place-items:center}
.chip .dot svg{width:15px; height:15px}
.chip small{color:var(--a-mut); font-family:var(--mono); font-size:11px}
.empty{padding:28px 18px; color:var(--a-mut); text-align:center}

/* tablet rail (POS categories) */
.rail{flex:none; width:230px; border-right:1px solid var(--a-line); background:var(--a-surface); padding:14px 10px; display:flex; flex-direction:column; gap:4px; overflow:auto}
.rail .r-head{display:flex; align-items:center; gap:10px; padding:4px 8px 14px}
.rail button.cat{display:flex; align-items:center; gap:10px; border:0; background:none; text-align:left; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:15px; font-weight:550; min-height:48px; color:var(--a-fg)}
.rail button.cat .sw{width:14px; height:14px; border-radius:4px; background:var(--sw); flex:none}
.rail button.cat .ct{margin-left:auto; font-size:12.5px; color:var(--a-mut); font-variant-numeric:tabular-nums}
.rail button.cat[aria-current="true"]{background:var(--a-acc-soft); color:var(--a-acc)}
.rail .r-foot{margin-top:auto; padding:10px 8px 0; border-top:1px solid var(--a-line); display:grid; gap:10px}

/* desktop side panel */
.side{flex:none; width:360px; border-left:1px solid var(--a-line); background:var(--a-surface); overflow:auto}
.side .pad{padding:18px; display:grid; gap:14px}

/* sheets */
.scrim{position:absolute; inset:0; background:var(--a-scrim); z-index:5; animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute; z-index:6; background:var(--a-surface); color:var(--a-fg); display:flex; flex-direction:column; max-height:86%; box-shadow:var(--shadow)}
.phone .sheet{left:0; right:0; bottom:0; border-radius:22px 22px 0 0; animation:up .2s ease-out; padding-bottom:20px}
.tablet .sheet{left:50%; top:50%; width:520px; transform:translate(-50%,-50%); border-radius:18px}
@keyframes up{from{transform:translateY(40%); opacity:.4}}
.grab{width:40px; height:5px; border-radius:3px; background:var(--a-line); margin:8px auto 0}
.sh-head{display:flex; gap:12px; align-items:center; padding:14px 18px 10px}
.sh-head .tl{width:52px; height:52px; border-radius:14px; background:var(--tc); color:#fff; display:grid; place-items:center; flex:none}
.sh-head .tl svg{width:28px; height:28px}
.sh-head h3{margin:0; font-size:17px}
.sh-head p{margin:0; font-size:13px; color:var(--a-mut)}
.x{margin-left:auto; width:40px; height:40px; border:0; background:var(--a-surface-2); border-radius:50%; cursor:pointer; display:grid; place-items:center; flex:none}
.stabs{display:flex; gap:4px; padding:0 14px; border-bottom:1px solid var(--a-line)}
.stabs button{border:0; background:none; padding:10px 10px 11px; font-size:14px; font-weight:550; color:var(--a-mut); border-bottom:2px solid transparent; cursor:pointer; min-height:44px}
.stabs button[aria-selected="true"]{color:var(--a-fg); border-bottom-color:var(--a-acc)}
.sh-body{padding:14px 18px; overflow:auto; display:grid; gap:10px}
.opt{display:grid; grid-template-columns:22px 1fr; gap:10px; align-items:start; border:1px solid var(--a-line); border-radius:12px; padding:12px; cursor:pointer; background:var(--a-surface)}
.opt[aria-checked="true"]{border-color:var(--a-acc); background:var(--a-acc-soft)}
.opt .rd{width:20px; height:20px; border-radius:50%; border:2px solid var(--a-line); margin-top:1px}
.opt[aria-checked="true"] .rd{border:6px solid var(--a-acc)}
.opt b{font-size:14.5px}
.opt .v{font-family:var(--mono); font-size:12px; color:var(--a-mut)}
.opt p{margin:4px 0 0; font-size:13px; color:var(--a-mut)}
.row{display:flex; gap:8px; flex-wrap:wrap}
.btn{border:1px solid var(--a-line); background:var(--a-surface); border-radius:10px; padding:0 14px; min-height:44px; font-size:14.5px; font-weight:550; cursor:pointer; display:inline-flex; align-items:center; gap:8px; justify-content:center}
.btn.pri{background:var(--a-brand); color:var(--a-brand-fg); border-color:var(--a-brand)}
.btn.sm{min-height:34px; font-size:13px; padding:0 10px; border-radius:8px}
.btn.full{width:100%}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13.5px}
.kv dt{color:var(--a-mut)}
.kv dd{margin:0; min-width:0; overflow-wrap:anywhere}
.stage-b{display:inline-flex; font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:6px}
.st-live{background:var(--a-ok-bg); color:var(--a-ok)} .st-pilot{background:var(--a-warn-bg); color:var(--a-warn)}
.st-poc{background:var(--a-poc-bg); color:var(--a-poc)} .st-dev{background:var(--a-dev-bg); color:var(--a-dev)}
textarea.ta{width:100%; min-height:90px; border:1px solid var(--a-line); border-radius:10px; padding:10px; background:var(--a-surface); resize:vertical}
.rate{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.rate button{border:1px solid var(--a-line); background:var(--a-surface); border-radius:10px; min-height:44px; cursor:pointer; font-size:13.5px}
.rate button[aria-pressed="true"]{border-color:var(--a-acc); background:var(--a-acc-soft); color:var(--a-acc); font-weight:600}
.toast{position:absolute; left:50%; bottom:28px; transform:translateX(-50%); z-index:9; background:var(--a-fg); color:var(--a-bg); padding:10px 16px; border-radius:12px; font-size:14px; max-width:86%; box-shadow:var(--shadow)}
.callout{border-left:3px solid var(--a-acc); background:var(--a-acc-soft); padding:10px 12px; border-radius:0 10px 10px 0; font-size:13.5px}
.callout.warn{border-color:var(--a-warn); background:var(--a-warn-bg)}

/* an opened app */
.app-head{display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--tc); color:#fff}
.app-head .apps-btn{display:inline-flex; align-items:center; gap:6px; border:0; background:rgb(255 255 255 / .18); color:#fff; border-radius:10px; padding:0 12px; min-height:40px; cursor:pointer; font-weight:600; font-size:14px}
.app-head h2{font-size:16px; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.app-body{padding:18px; display:grid; gap:14px; align-content:start}
.app-top{flex:none; display:flex; align-items:center; gap:10px; padding:8px 14px; min-height:58px; background:var(--a-surface); border-bottom:1px solid var(--a-line)}
.app-top .mk{width:32px; height:32px; border-radius:9px; background:var(--tc); color:#fff; display:grid; place-items:center; flex:none}
.app-top .mk svg{width:19px; height:19px}
.app-top h2{font-size:16px; margin:0; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stripe{flex:none; height:3px; background:var(--ch)}
.icon-btn{position:relative; width:44px; height:44px; border:0; border-radius:12px; background:var(--a-surface-2); display:grid; place-items:center; cursor:pointer; flex:none}
.cdot{position:absolute; top:6px; right:calc(50% - 20px); width:9px; height:9px; border-radius:50%; background:var(--ch); box-shadow:0 0 0 2px var(--a-surface)}
.icon-btn .cdot,.fab .cdot{right:6px}
.app-frame{flex:1; min-height:0; display:flex}

const APP_NAV = {

  'sim-scan':[['scan', 'Scan'], ['search', 'Find']],

const ACTIVE = { 'create-order':'Create Order', 'sim-cards':'Company Assets', manage:'Manage apps' }
const CH_COLOR = { beta:'#e8590c', preview:'#6d4bb3', photos:'#a33a7c' }
const initials = () => me().full.split(' ').map(x => x[0]).join('')

function chrome({ host, label, c, active, content }) {
  const L = t()
  const off = !!(c && host.channels?.stable && c !== 'stable')
  const chc = off ? (CH_COLOR[c] || '#e8590c') : ''
  const dot = off ? `<span class="cdot" style="--ch:${chc}" title="${esc(chLabel(host, c))}"></span>` : ''
  const ver = c && host.channels?.[c] ? `${chLabel(host, c)} · ${host.channels[c]}` : ''
  const nav = APP_NAV[host.id] || [['box', 'Home']]
  const on = active || nav[0][1]
  const item = ([i, l]) => `<button class="it ${l === on ? 'on' : ''}" type="button">${ic(i, 20)}<span>${esc(l)}</span></button>`
  const appsItem = `<button class="it" type="button" data-act="back">${ic('grid', 20)}<span>${esc(L.back)}</span>${dot}</button>`
  const way = S.way
  let top
  if (way === 'bar') {
    const chip = ver ? `<span class="badge">${esc(ver)}</span>` : ''
    top = `<div class="app-head" style="--tc:${host.color}"><button class="apps-btn" type="button" data-act="back">${ic('grid', 18)} ${esc(L.back)}</button><h2>${esc(label)}</h2>${chip}</div>`
  } else {
    top = `${off ? `<div class="stripe" style="--ch:${chc}"></div>` : ''}<div class="app-top" style="--tc:${host.color}"><div class="mk">${ic(host.icon)}</div><h2>${esc(label)}</h2>
      ${way === 'icon' ? `<button class="icon-btn" type="button" data-act="back" aria-label="${esc(L.back)}" title="${esc(L.back)}">${ic('grid', 20)}${dot}</button>` : ''}<div class="avatar">${esc(initials())}</div></div>`

function render() {
  const d = S.device
  scr.className = 'screen ' + d
  let html = ''
  const staffSkip = realApps().length <= 1 && !S.forceLaunch
  if (S.view === 'open') html = openHTML()
  else if (S.view === 'manage') html = manageHTML()
  else if (staffSkip) html = skipHTML()
  else html = urlHTML(`https://${ORIGIN}/apps/`, 1) + homeHTML()
  if (S.sheet && S.view === 'home' && d !== 'desktop') html += `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-label="${esc(name(app(S.sheet)))}">${sheetInner(app(S.sheet))}</div>`
  if (S.toast) html += `<div class="toast" role="status">${esc(S.toast)}</div>`
  // keep the search box's focus and caret through a re-render
  const active = document.activeElement
  const focusQ = active && active.id === 'q', pos = focusQ ? active.selectionStart : 0
  scr.innerHTML = html
  if (focusQ) { const q = document.getElementById('q'); if (q) { q.focus(); q.setSelectionRange(pos, pos) } }
  hint()
  fit()
}
function hint() {
  document.querySelectorAll('.hint').forEach(e => e.classList.remove('hint'))
  const f = FLOWS.find(x => x.id === S.flow)

  if (!st?.target) return
  for (const sel of st.target.split(',').map(s => s.trim()).reverse()) {
    const el = document.querySelector(sel)
    if (el) { el.classList.add('hint'); break }
  }
}

/* ---------- device scaling ---------- */
const SIZES = { phone:[390, 844], tablet:[1180, 820], desktop:[1440, 900] }
const dev = document.getElementById('device'), wrap = document.getElementById('dev-wrap'), stage = document.getElementById('stage')
function fit() {
  const [w, h] = SIZES[S.device]
  const bw = S.device === 'phone' ? 24 : S.device === 'tablet' ? 20 : 2
  const W = w + bw, H = h + bw
  const avail = stage.clientWidth - 36
  const maxH = Math.max(420, window.innerHeight - 130)
  const s = Math.min(1, avail / W, maxH / H)
  dev.className = 'device ' + S.device
  dev.style.width = W + 'px'; dev.style.height = H + 'px'
  dev.style.transform = `scale(${s})`
  wrap.style.width = W * s + 'px'; wrap.style.height = H * s + 'px'
}
new ResizeObserver(() => fit()).observe(stage)

  if (d.more) { e.stopPropagation(); openSheet(d.more); return }
  if (el.id === 'labs') { S.labs = !S.labs; emit('labs'); render(); return }

  if (d.cat) { S.cat = d.cat; render(); return }
  if (d.tab) { S.tab = d.tab; render(); return }

  if (d.ch) { S.choice[S.sheet] = d.ch; const a = app(S.sheet); toast(fmt(L.chosen, { a:name(a), c:chLabel(a, d.ch) })); emit(`ch:${S.sheet}:${d.ch}`); render(); return }
  if (d.adm) { S.admSel = d.adm; S.adm = 'list'; S.admPicked = true; emit('adm:' + d.adm); render(); return }
  if (d.aud) { const a = app(S.admSel); a.aud = a.aud.includes(d.aud) ? a.aud.filter(r => r !== d.aud) : [...a.aud, d.aud]; render(); return }
  if (d.tier) { S.reg.tier = d.tier; render(); return }
  if (d.promote) {
    const a = app(S.admSel), from = a.channels.stable
    a.channels.stable = d.promote
    S.moves.push({ app:a.id, ch:'stable', from, to:d.promote })
    toast(fmt(L.moved, { c:t().ch.stable, v:d.promote })); emit('promote'); render(); return
  }
  switch (d.act) {
    case 'close': S.sheet = null; render(); break
    case 'force': S.forceLaunch = true; emit('force'); render(); break
    case 'back': S.view = 'home'; S.open = null; S.more = false; emit('back'); render(); break
    case 'app-more': S.more = !S.more; render(); break
    case 'open-sheet': openApp(S.sheet); break

      const on = list.includes(id)

    }

      render(); break
    }
    case 'reg-open': S.adm = 'reg'; S.reg = { name:'Signature Pad', tier:'here', group:'labs', url:'' }; emit('reg-open'); render(); break
    case 'adm-back': S.adm = 'list'; S.admPicked = false; render(); break
    case 'register': {

      const id = r.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'new-app'

        needs:'Whatever its permissions allow.', versions:[] }

  }
})

document.getElementById('reset').addEventListener('click', () => { reset({ device:S.device, lang:S.lang, way:S.way }); syncControls(); render(); renderFlows() })

/* ---------- flows panel ---------- */
const flowList = document.getElementById('flow-list'), flowNow = document.getElementById('flow-now')
function renderFlows() {
  flowList.innerHTML = FLOWS.map((f, i) => `<button class="flow-btn" type="button" data-flow="${f.id}" aria-current="${S.flow === f.id}"><span class="n">${i + 1}</span><span><b>${f.title}</b><span>${f.sub}</span></span></button>`).join('')
  const f = FLOWS.find(x => x.id === S.flow)
  if (!f) { flowNow.innerHTML = ''; hint(); return }
  const done = S.step >= f.steps.length
  flowNow.innerHTML = `<div style="display:grid;gap:10px"><h2>${f.title}</h2><ol class="steps">${f.steps.map((s, i) => `<li class="${i < S.step ? 'done' : i === S.step ? 'now' : ''}"><span>${s.text}</span></li>`).join('')}</ol>
    ${done ? `<p style="color:var(--c-ok);font-weight:600;margin:0">Flow done.</p>` : ''}<div class="why">${f.why}</div>
    <div><button class="link-btn" type="button" id="restart">Start this flow again</button></div></div>`
  document.getElementById('restart').onclick = () => startFlow(f.id)
  hint()
}
flowList.addEventListener('click', e => { const b = e.target.closest('[data-flow]'); if (b) startFlow(b.dataset.flow) })

syncControls(); render(); renderFlows()
})()
</script>
</body>
</html>
