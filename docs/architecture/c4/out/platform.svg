<g class="node" data-id="spaces"><title>Object storage [External System]
DigitalOcean Spaces (S3 API), private buckets: signed copies, personnel document copies, off-site DB backups.</title><rect x="1010" y="1060" width="236" height="128" rx="6" fill="#8a8a8a" stroke="#6b6b6b"/><text x="1128" y="1089" class="n" fill="#ffffff">Object storage</text><text x="1128" y="1104" class="t" fill="#ffffff">[External System]</text><text x="1128" y="1127" class="d" fill="#ffffff">DigitalOcean Spaces (S3 API),</text><text x="1128" y="1142" class="d" fill="#ffffff">private buckets: signed copies,</text><text x="1128" y="1157" class="d" fill="#ffffff">personnel document copies, off-site</text><text x="1128" y="1172" class="d" fill="#ffffff">DB backups.</text></g>
<g class="node" data-id="openai"><title>OpenAI API [External System]
Generates colour ID photos for Personnel files; validates the stored API key.</title><rect x="728" y="1060" width="236" height="113" rx="6" fill="#8a8a8a" stroke="#6b6b6b"/><text x="846" y="1089" class="n" fill="#ffffff">OpenAI API</text><text x="846" y="1104" class="t" fill="#ffffff">[External System]</text><text x="846" y="1127" class="d" fill="#ffffff">Generates colour ID photos for</text><text x="846" y="1142" class="d" fill="#ffffff">Personnel files; validates the</text><text x="846" y="1157" class="d" fill="#ffffff">stored API key.</text></g>
<g class="node" data-id="tsa"><title>Timestamp authority [External System]
Public RFC 3161 TSA (DigiCert by default); timestamps the hash of each day's audit seal.</title><rect x="1352" y="1060" width="236" height="113" rx="6" fill="#8a8a8a" stroke="#6b6b6b"/><text x="1470" y="1089" class="n" fill="#ffffff">Timestamp authority</text><text x="1470" y="1104" class="t" fill="#ffffff">[External System]</text><text x="1470" y="1127" class="d" fill="#ffffff">Public RFC 3161 TSA (DigiCert by</text><text x="1470" y="1142" class="d" fill="#ffffff">default); timestamps the hash of</text><text x="1470" y="1157" class="d" fill="#ffffff">each day's audit seal.</text></g>
<g class="node" data-id="cWorkwear"><title>Workwear ordering [Component: catalogue, itemset, order, supplier]
Catalogue, item sets, suppliers; orders with immutable snapshot lines, ORDERED → GIVEN, one-time confirmation links.</title><rect x="1511.9999999999998" y="256" width="236" height="142" rx="6" fill="#85bbf0" stroke="#78a8d8"/><text x="1629.9999999999998" y="285" class="n" fill="#000000">Workwear ordering</text><text x="1629.9999999999998" y="300" class="t" fill="#000000">[Component: catalogue, itemset,</text><text x="1629.9999999999998" y="314" class="t" fill="#000000">order, supplier]</text><text x="1629.9999999999998" y="337" class="d" fill="#000000">Catalogue, item sets, suppliers;</text><text x="1629.9999999999998" y="352" class="d" fill="#000000">orders with immutable snapshot</text><text x="1629.9999999999998" y="367" class="d" fill="#000000">lines, ORDERED → GIVEN, one-time</text><text x="1629.9999999999998" y="382" class="d" fill="#000000">confirmation links.</text></g>
<g class="node" data-id="cAssets"><title>Company Assets [Component: asset]
SIM cards, equipment, furniture; assignments, connection status, assignment forms, signed copies; PIN/PUK sealed.</title><rect x="423.8" y="270" width="236" height="128" rx="6" fill="#85bbf0" stroke="#78a8d8"/><text x="541.8" y="299" class="n" fill="#000000">Company Assets</text><text x="541.8" y="314" class="t" fill="#000000">[Component: asset]</text><text x="541.8" y="337" class="d" fill="#000000">SIM cards, equipment, furniture;</text><text x="541.8" y="352" class="d" fill="#000000">assignments, connection status,</text><text x="541.8" y="367" class="d" fill="#000000">assignment forms, signed copies;</text><text x="541.8" y="382" class="d" fill="#000000">PIN/PUK sealed.</text></g>
<g class="node" data-id="cPersonnel"><title>Personnel files [Component: personnel/document, scan, mrz, colour]
Identity documents and copies sealed per person, MRZ checks, kept scans, retention and shredding (special-care data).</title><rect x="167.8" y="256" width="236" height="142" rx="6" fill="#85bbf0" stroke="#78a8d8"/><text x="285.8" y="285" class="n" fill="#000000">Personnel files</text><text x="285.8" y="300" class="t" fill="#000000">[Component: personnel/document,</text><text x="285.8" y="314" class="t" fill="#000000">scan, mrz, colour]</text><text x="285.8" y="337" class="d" fill="#000000">Identity documents and copies sealed</text><text x="285.8" y="352" class="d" fill="#000000">per person, MRZ checks, kept scans,</text><text x="285.8" y="367" class="d" fill="#000000">retention and shredding</text><text x="285.8" y="382" class="d" fill="#000000">(special-care data).</text></g>
<g class="node" data-id="cAuth"><title>Auth &amp; sessions [Component: user, session, role, security; bcrypt, JWT HS256]
Sign-in, 15-min access tokens, HttpOnly refresh sessions, editable roles of permissions, throttling, security events.</title><rect x="679.8" y="256" width="236" height="142" rx="6" fill="#85bbf0" stroke="#78a8d8"/><text x="797.8" y="285" class="n" fill="#000000">Auth &amp; sessions</text><text x="797.8" y="300" class="t" fill="#000000">[Component: user, session, role,</text><text x="797.8" y="314" class="t" fill="#000000">security; bcrypt, JWT HS256]</text><text x="797.8" y="337" class="d" fill="#000000">Sign-in, 15-min access tokens,</text><text x="797.8" y="352" class="d" fill="#000000">HttpOnly refresh sessions, editable</text><text x="797.8" y="367" class="d" fill="#000000">roles of permissions, throttling,</text><text x="797.8" y="382" class="d" fill="#000000">security events.</text></g>
<g class="node" data-id="cJobs"><title>Upkeep jobs [Component: goroutine (jobs.go)]
Purges old security/error/audit events, seals and verifies audit days, records usage, shreds expired personnel files.</title><rect x="226.8" y="46" width="236" height="128" rx="6" fill="#85bbf0" stroke="#78a8d8"/><text x="344.8" y="75" class="n" fill="#000000">Upkeep jobs</text><text x="344.8" y="90" class="t" fill="#000000">[Component: goroutine (jobs.go)]</text><text x="344.8" y="113" class="d" fill="#000000">Purges old security/error/audit</text><text x="344.8" y="128" class="d" fill="#000000">events, seals and verifies audit</text><text x="344.8" y="143" class="d" fill="#000000">days, records usage, shreds expired</text><text x="344.8" y="158" class="d" fill="#000000">personnel files.</text></g>
<g class="node" data-id="cAi"><title>AI usage [Component: aiusage]
The one client for AI calls: records model, tokens and cost; monthly budget; sealed OpenAI key.</title><rect x="639" y="530" width="236" height="113" rx="6" fill="#85bbf0" stroke="#78a8d8"/><text x="757" y="559" class="n" fill="#000000">AI usage</text><text x="757" y="574" class="t" fill="#000000">[Component: aiusage]</text><text x="757" y="597" class="d" fill="#000000">The one client for AI calls: records</text><text x="757" y="612" class="d" fill="#000000">model, tokens and cost; monthly</text><text x="757" y="627" class="d" fill="#000000">budget; sealed OpenAI key.</text></g>
<g class="node" data-id="cAudit"><title>Audit log [Component: audit, tsa]
Append-only change events; daily hash seals with trusted timestamps; verification and export.</title><rect x="1352.2666666666664" y="530" width="236" height="113" rx="6" fill="#85bbf0" stroke="#78a8d8"/><text x="1470.2666666666664" y="559" class="n" fill="#000000">Audit log</text><text x="1470.2666666666664" y="574" class="t" fill="#000000">[Component: audit, tsa]</text><text x="1470.2666666666664" y="597" class="d" fill="#000000">Append-only change events; daily</text><text x="1470.2666666666664" y="612" class="d" fill="#000000">hash seals with trusted timestamps;</text><text x="1470.2666666666664" y="627" class="d" fill="#000000">verification and export.</text></g>
<g class="node" data-id="cPdf"><title>PDF rendering [Component: formpdf, registerpdf, pdf-mini]
A4 receipts (EN/RU), assignment forms and registers.</title><rect x="1681.9999999999998" y="530" width="236" height="112" rx="6" fill="#85bbf0" stroke="#78a8d8"/><text x="1799.9999999999998" y="559" class="n" fill="#000000">PDF rendering</text><text x="1799.9999999999998" y="574" class="t" fill="#000000">[Component: formpdf, registerpdf,</text><text x="1799.9999999999998" y="588" class="t" fill="#000000">pdf-mini]</text><text x="1799.9999999999998" y="611" class="d" fill="#000000">A4 receipts (EN/RU), assignment</text><text x="1799.9999999999998" y="626" class="d" fill="#000000">forms and registers.</text></g>
<g class="node" data-id="cSeal"><title>Sealbox [Component: sealbox (AEAD, key IDs, rotation)]
