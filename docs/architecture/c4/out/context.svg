<g class="node" data-id="staff"><title>Office staff [Person]
Prepares workwear orders, records receipts, keeps employees, the catalogue and company assets. Roles: employee, manager.</title><rect x="114" y="58" width="236" height="128" rx="28" fill="#08427b" stroke="#073b6f"/><circle cx="232" cy="46" r="25" fill="#08427b" stroke="#073b6f"/><text x="232" y="87" class="n" fill="#ffffff">Office staff</text><text x="232" y="102" class="t" fill="#ffffff">[Person]</text><text x="232" y="125" class="d" fill="#ffffff">Prepares workwear orders, records</text><text x="232" y="140" class="d" fill="#ffffff">receipts, keeps employees, the</text><text x="232" y="155" class="d" fill="#ffffff">catalogue and company assets. Roles:</text><text x="232" y="170" class="d" fill="#ffffff">employee, manager.</text></g>
<g class="node" data-id="admin"><title>Administrator [Person]
Manages users, roles, settings, mail templates, apps and backups; reviews the audit log and security events.</title><rect x="420" y="73" width="236" height="113" rx="28" fill="#08427b" stroke="#073b6f"/><circle cx="538" cy="61" r="25" fill="#08427b" stroke="#073b6f"/><text x="538" y="102" class="n" fill="#ffffff">Administrator</text><text x="538" y="117" class="t" fill="#ffffff">[Person]</text><text x="538" y="140" class="d" fill="#ffffff">Manages users, roles, settings, mail</text><text x="538" y="155" class="d" fill="#ffffff">templates, apps and backups; reviews</text><text x="538" y="170" class="d" fill="#ffffff">the audit log and security events.</text></g>
<g class="node" data-id="worker"><title>Employee (wearer) [Person]
Receives workwear, PPE and equipment; confirms receipt through a one-time link, without signing in.</title><rect x="702" y="73" width="236" height="113" rx="28" fill="#08427b" stroke="#073b6f"/><circle cx="820" cy="61" r="25" fill="#08427b" stroke="#073b6f"/><text x="820" y="102" class="n" fill="#ffffff">Employee (wearer)</text><text x="820" y="117" class="t" fill="#ffffff">[Person]</text><text x="820" y="140" class="d" fill="#ffffff">Receives workwear, PPE and</text><text x="820" y="155" class="d" fill="#ffffff">equipment; confirms receipt through</text><text x="820" y="170" class="d" fill="#ffffff">a one-time link, without signing in.</text></g>
<g class="node" data-id="supplier"><title>Supplier [External Person]
Delivers workwear and PPE; receives orders as WhatsApp messages.</title><rect x="75" y="748" width="236" height="98" rx="28" fill="#686868" stroke="#4d4d4d"/><circle cx="193" cy="736" r="25" fill="#686868" stroke="#4d4d4d"/><text x="193" y="777" class="n" fill="#ffffff">Supplier</text><text x="193" y="792" class="t" fill="#ffffff">[External Person]</text><text x="193" y="815" class="d" fill="#ffffff">Delivers workwear and PPE; receives</text><text x="193" y="830" class="d" fill="#ffffff">orders as WhatsApp messages.</text></g>
<g class="node" data-id="provider"><title>Mobile operator [External Person]
Activates and blocks company SIM cards when asked by email.</title><rect x="357" y="1057" width="236" height="98" rx="28" fill="#686868" stroke="#4d4d4d"/><circle cx="475" cy="1045" r="25" fill="#686868" stroke="#4d4d4d"/><text x="475" y="1086" class="n" fill="#ffffff">Mobile operator</text><text x="475" y="1101" class="t" fill="#ffffff">[External Person]</text><text x="475" y="1124" class="d" fill="#ffffff">Activates and blocks company SIM</text><text x="475" y="1139" class="d" fill="#ffffff">cards when asked by email.</text></g>
<g class="node" data-id="ppe"><title>PPE-next2 (Workwear &amp; Equipment) [Software System]
Internal platform: workwear/PPE orders and receipts, company assets (SIM cards, equipment), personnel files, administration and an app launcher.</title><rect x="678" y="372" width="236" height="161" rx="6" fill="#1168bd" stroke="#0b4884"/><text x="796" y="401" class="n" fill="#ffffff">PPE-next2 (Workwear &amp;</text><text x="796" y="419" class="n" fill="#ffffff">Equipment)</text><text x="796" y="434" class="t" fill="#ffffff">[Software System]</text><text x="796" y="457" class="d" fill="#ffffff">Internal platform: workwear/PPE</text><text x="796" y="472" class="d" fill="#ffffff">orders and receipts, company assets</text><text x="796" y="487" class="d" fill="#ffffff">(SIM cards, equipment), personnel</text><text x="796" y="502" class="d" fill="#ffffff">files, administration and an app</text><text x="796" y="517" class="d" fill="#ffffff">launcher.</text></g>
<g class="node" data-id="openai"><title>OpenAI API [External System]
Generates colour ID photos for Personnel files; validates the stored API key.</title><rect x="1203" y="710" width="236" height="113" rx="6" fill="#8a8a8a" stroke="#6b6b6b"/><text x="1321" y="739" class="n" fill="#ffffff">OpenAI API</text><text x="1321" y="754" class="t" fill="#ffffff">[External System]</text><text x="1321" y="777" class="d" fill="#ffffff">Generates colour ID photos for</text><text x="1321" y="792" class="d" fill="#ffffff">Personnel files; validates the</text><text x="1321" y="807" class="d" fill="#ffffff">stored API key.</text></g>
<g class="node" data-id="tsa"><title>Timestamp authority [External System]
Public RFC 3161 TSA (DigiCert by default); timestamps the hash of each day's audit seal.</title><rect x="1485" y="710" width="236" height="113" rx="6" fill="#8a8a8a" stroke="#6b6b6b"/><text x="1603" y="739" class="n" fill="#ffffff">Timestamp authority</text><text x="1603" y="754" class="t" fill="#ffffff">[External System]</text><text x="1603" y="777" class="d" fill="#ffffff">Public RFC 3161 TSA (DigiCert by</text><text x="1603" y="792" class="d" fill="#ffffff">default); timestamps the hash of</text><text x="1603" y="807" class="d" fill="#ffffff">each day's audit seal.</text></g>
<g class="node" data-id="spaces"><title>Object storage [External System]
DigitalOcean Spaces (S3 API), private buckets: signed copies, personnel document copies, off-site DB backups.</title><rect x="921" y="710" width="236" height="128" rx="6" fill="#8a8a8a" stroke="#6b6b6b"/><text x="1039" y="739" class="n" fill="#ffffff">Object storage</text><text x="1039" y="754" class="t" fill="#ffffff">[External System]</text><text x="1039" y="777" class="d" fill="#ffffff">DigitalOcean Spaces (S3 API),</text><text x="1039" y="792" class="d" fill="#ffffff">private buckets: signed copies,</text><text x="1039" y="807" class="d" fill="#ffffff">personnel document copies, off-site</text><text x="1039" y="822" class="d" fill="#ffffff">DB backups.</text></g>
<g class="node" data-id="uptime"><title>DigitalOcean Monitoring [External System]
Uptime check on /ready plus droplet alerts; emails the operator.</title><rect x="984" y="88" width="236" height="98" rx="6" fill="#8a8a8a" stroke="#6b6b6b"/><text x="1102" y="117" class="n" fill="#ffffff">DigitalOcean Monitoring</text><text x="1102" y="132" class="t" fill="#ffffff">[External System]</text><text x="1102" y="155" class="d" fill="#ffffff">Uptime check on /ready plus droplet</text><text x="1102" y="170" class="d" fill="#ffffff">alerts; emails the operator.</text></g>
<g class="node" data-id="acme"><title>Let's Encrypt [External System]
Issues and renews TLS certificates (ACME).</title><rect x="639" y="710" width="236" height="98" rx="6" fill="#8a8a8a" stroke="#6b6b6b"/><text x="757" y="739" class="n" fill="#ffffff">Let's Encrypt</text><text x="757" y="754" class="t" fill="#ffffff">[External System]</text><text x="757" y="777" class="d" fill="#ffffff">Issues and renews TLS certificates</text><text x="757" y="792" class="d" fill="#ffffff">(ACME).</text></g>
<g class="node" data-id="whatsapp"><title>WhatsApp [External System]
Messaging app on the staff member's phone or desktop.</title><rect x="75" y="403.5" width="236" height="98" rx="6" fill="#8a8a8a" stroke="#6b6b6b"/><text x="193" y="432.5" class="n" fill="#ffffff">WhatsApp</text><text x="193" y="447.5" class="t" fill="#ffffff">[External System]</text><text x="193" y="470.5" class="d" fill="#ffffff">Messaging app on the staff member's</text><text x="193" y="485.5" class="d" fill="#ffffff">phone or desktop.</text></g>
<g class="node" data-id="mailapp"><title>Email client [External System]
The staff member's own mail app; sends the emails the app prepares (mailto:). The system sends no email itself.</title><rect x="357" y="714" width="236" height="128" rx="6" fill="#8a8a8a" stroke="#6b6b6b"/><text x="475" y="743" class="n" fill="#ffffff">Email client</text><text x="475" y="758" class="t" fill="#ffffff">[External System]</text><text x="475" y="781" class="d" fill="#ffffff">The staff member's own mail app;</text><text x="475" y="796" class="d" fill="#ffffff">sends the emails the app prepares</text><text x="475" y="811" class="d" fill="#ffffff">(mailto:). The system sends no email</text><text x="475" y="826" class="d" fill="#ffffff">itself.</text></g>
